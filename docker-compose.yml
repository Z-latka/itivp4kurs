name: mindcare

services:
  db:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-mindcare}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-mindcare_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-mindcare}
    volumes:
      - mongo-data:/data/db
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: .
    image: mindcare-backend:latest
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-mindcare}:${MONGO_ROOT_PASSWORD:-mindcare_pass}@db:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-mindcare}
      MONGO_DNS: ""
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net

  seed:
    build: .
    image: mindcare-backend:latest
    command: ["node", "scripts/seed.js"]
    restart: "no"
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-mindcare}:${MONGO_ROOT_PASSWORD:-mindcare_pass}@db:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-mindcare}
      MONGO_DNS: ""
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net

  frontend:
    build:
      context: ./psychology-client
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: /
    image: mindcare-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net

  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-mindcare}:${MONGO_ROOT_PASSWORD:-mindcare_pass}@db:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD:-admin_pass}
      ME_CONFIG_BASICAUTH: "true"
    ports:
      - "127.0.0.1:${ME_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
      - admin-net

volumes:
  mongo-data:

networks:
  backend-net:
    internal: true
  frontend-net:
  admin-net:
